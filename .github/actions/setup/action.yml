name: Setup pnpm
description: Install pnpm, Node, and dependencies from the lockfile.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.8.1
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
